name: ci-security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasio-dev libssl-dev libsqlite3-dev
      - name: Build and test
        working-directory: api
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-extended
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasio-dev libssl-dev libsqlite3-dev
      - name: Build
        working-directory: api
        run: cmake -S . -B build && cmake --build build -j
      - uses: github/codeql-action/analyze@v4

  container:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nimbus-api:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nimbus-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
